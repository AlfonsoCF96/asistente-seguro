  msgs.scrollTop = msgs.scrollHeight;
}

function setQuickBtns(btns) {
  const el = document.getElementById('qbtns');
  el.innerHTML = '';
  btns.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'qb';
    btn.textContent = b;
    btn.onclick = () => { clearQuickBtns(); sendMsg(b); };
    el.appendChild(btn);
  });
}

function clearQuickBtns() {
  document.getElementById('qbtns').innerHTML = '';
}

function setLoading(on) {
  document.getElementById('send-btn').disabled = on;
  const msgs = document.getElementById('msgs');
  if (on) {
    const t = document.createElement('div');
    t.className = 'row';
    t.id = 'typing';
    t.innerHTML = `${avatarHTML()}<div class="typing-bbl"><span></span><span></span><span></span></div>`;
    msgs.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;
  } else {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }
}

function fmtText(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .split('\n')
    .filter(l => l.trim() !== '')
    .map(l => `<p>${l}</p>`)
    .join('');
}

function parseConectarAlfonso(text) {
  const m = text.match(/\[CONECTAR_ALFONSO:motivo=([^\]]+)\]/);
  return m ? m[1].trim() : null;
}

function shouldShowRating(text) {
  return /\[MOSTRAR_RATING\]/.test(text);
}

function cleanReply(text) {
  return text
    .replace(/\[CONECTAR_ALFONSO:[^\]]+\]/g, '')
    .replace(/\[MOSTRAR_RATING\]/g, '')
    .trim();
}

function showWAButton(intro, waText) {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'row';
  wrap.innerHTML = `${avatarHTML()}<div style="max-width:80%">
    <div class="bbl a"><p>${intro}</p></div>
    <button class="wa-btn" onclick="openWA(\`${waText.replace(/`/g, "\\`")}\`)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.553 4.116 1.522 5.847L.057 23.882l6.198-1.625A11.935 11.935 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.007-1.373l-.36-.214-3.724.976.996-3.63-.234-.374A9.818 9.818 0 0112 2.182c5.42 0 9.818 4.398 9.818 9.818S17.42 21.818 12 21.818z"/></svg>
      Hablar con Alfonso por WhatsApp
    </button>
  </div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function openWA(text) {
  const encoded = encodeURIComponent(text);
  window.open(`https://wa.me/${WA_NUMBER}?text=${encoded}`, '_blank');
}

function buildWATextForAlfonso(motivo) {
  return `Hola Alfonso! 👋 Vengo de hablar con Pini.

📋 *Resumen de mi consulta:*
${motivo || 'Necesito ayuda con mi seguro.'}

¿Me puedes apoyar? 🙏`;
}

let currentRating = 0;

function showRatingCard() {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'row';
  wrap.id = 'rating-row';
  wrap.innerHTML = `${avatarHTML()}<div style="max-width:85%;width:85%">
    <div class="rating-card">
      <div class="rating-q">Antes de cerrar, ¿me ayudas con algo rápido? 🙏<br><br><strong>¿Qué tan útil fue esta ayuda?</strong></div>
      <div class="stars" id="stars">
        ${[1,2,3,4,5].map(n => `<span class="star" data-n="${n}" onclick="selectStar(${n})" onmouseenter="hoverStar(${n})" onmouseleave="hoverStar(0)">★</span>`).join('')}
      </div>
    </div>
  </div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function hoverStar(n) {
  document.querySelectorAll('#stars .star').forEach((s, i) => {
    s.classList.toggle('hover', i < n);
  });
}

function selectStar(n) {
  currentRating = n;
  document.querySelectorAll('#stars .star').forEach((s, i) => {
    s.classList.toggle('active', i < n);
  });
  setTimeout(showFeedbackInput, 350);
}

function showFeedbackInput() {
  const card = document.querySelector('#rating-row .rating-card');
  if (!card || card.dataset.expanded === '1') return;
  card.dataset.expanded = '1';
  card.innerHTML += `
    <div class="rating-q" style="margin-top:14px"><strong>¿Hay algo que podríamos mejorar?</strong> (opcional)</div>
    <textarea class="feedback-input" id="feedback-text" placeholder="Tu comentario..."></textarea>
    <button class="feedback-send" id="feedback-send-btn" onclick="sendFeedback()">Enviar y mandar a Alfonso por WhatsApp</button>
    <button class="skip-btn" onclick="skipFeedback()">Saltar</button>
  `;
  const msgs = document.getElementById('msgs');
  msgs.scrollTop = msgs.scrollHeight;
}

function buildFeedbackWAText(rating, comment) {
  const stars = '⭐'.repeat(rating) + (rating < 5 ? '☆'.repeat(5 - rating) : '');
  return `Hola Alfonso! 🙌 Acabo de usar a Pini y aquí va mi feedback:

*Calificación:* ${stars} (${rating}/5)
*Comentario:* ${comment || '(sin comentario)'}

¡Saludos!`;
}

function sendFeedback() {
  const text = document.getElementById('feedback-text').value.trim();
  const waText = buildFeedbackWAText(currentRating, text);
  const card = document.querySelector('#rating-row .rating-card');
  card.innerHTML = `<div class="rating-q" style="text-align:center">¡Gracias por tu feedback, nos ayuda muchísimo! 🙌<br><br>Te abrimos WhatsApp para enviárselo a Alfonso.</div>`;
  setTimeout(() => openWA(waText), 600);
}

function skipFeedback() {
  const waText = buildFeedbackWAText(currentRating, '');
  const card = document.querySelector('#rating-row .rating-card');
  card.innerHTML = `<div class="rating-q" style="text-align:center">¡Gracias por tu calificación! 🙌</div>`;
  setTimeout(() => openWA(waText), 600);
}

async function sendMsg(override) {
  const inp = document.getElementById('inp');
  const msg = override || inp.value.trim();
  if (!msg) return;
  inp.value = '';
  clearQuickBtns();
  addMsg('user', `<p>${escapeHtml(msg)}</p>`);
  history.push({ role: 'user', content: msg });
  setLoading(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM, messages: history })
    });

    if (!res.ok) {
      throw new Error('Error de servidor');
    }

    const data = await res.json();
    let raw = data.content?.map(b => b.text).join('') || 'Hubo un problema, intenta de nuevo.';

    const motivo = parseConectarAlfonso(raw);
    const showRating = shouldShowRating(raw);
    const reply = cleanReply(raw);

    history.push({ role: 'assistant', content: reply });
    setLoading(false);

    if (reply) {
      addMsg('assistant', fmtText(reply));
    }

    if (motivo) {
      setTimeout(() => {
        showWAButton(
          'Aquí abajo puedes contactar a Alfonso directamente 👇',
          buildWATextForAlfonso(motivo)
        );
      }, 400);
    }

    if (showRating) {
      setTimeout(showRatingCard, 600);
    }

  } catch (err) {
    console.error(err);
    setLoading(false);
    addMsg('assistant', '<p>Ups, hubo un problema de conexión. ¿Lo intentamos de nuevo? 🙏</p>');
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

window.onload = () => {
  setTimeout(() => {
    addMsg('assistant',
      `<p>Hola 👋 soy <strong>Pini</strong>, el asistente de <strong>${ALFONSO_NOMBRE}</strong>.</p>
       <p>Estoy aquí para ayudarte con cualquier duda sobre tu seguro o acompañarte si tienes algún problema 🙂</p>
       <p>¿En qué te puedo apoyar?</p>`
    );
    setQuickBtns([
      '🚗 Tengo un accidente',
      '📄 Duda sobre mi póliza',
      '🏥 Tema de gastos médicos',
      '🐶 Mi mascota',
      '💬 Otra cosa'
    ]);
  }, 300);
};
</script>
